<!DOCTYPE html><html><head><meta charset="utf-8"><style>
body{width:320px;padding:12px;background:#111;color:#fff;font-family:Inter,system-ui,sans-serif;margin:0}
h3{margin:0 0 4px;font-size:15px}small{opacity:.6;font-size:11px}button{width:100%;padding:10px;border-radius:10px;border:0;font-weight:700;margin-top:8px;cursor:pointer}.primary{background:#fff;color:#000}.sec{background:#222;color:#fff;border:1px solid #333}.row{display:flex;gap:8px}.row button{flex:1}.toggle{display:flex;align-items:center;justify-content:space-between;background:#1a1a1a;border:1px solid #292929;border-radius:10px;padding:10px;margin-top:10px;font-size:11px}.pill{padding:4px 8px;border-radius:12px;background:#222}.on{background:#17351f;color:#4ade80}.off{color:#aaa}</style></head><body>
<h3>Flow Automator</h3><small>Popup = quick control · tidak auto-start Flow</small>
<div class="toggle"><span>Auto Download</span><span id="dl" class="pill off">OFF</span></div>
<div class="row"><button class="primary" id="openSetup">Open Setup Tab</button></div>
<div class="row"><button class="sec" id="openFlow">Buka Flow</button><button class="sec" id="reload">Reload</button></div>
<script src="popup.js"></script></body></html>
